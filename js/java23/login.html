<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>login</h2>
    <form id="loginForm">
       
        <label>Email</label>`
        <input type="text" id="email">
        <p id="emailError" class="error"></p>
        <label>Password</label>
        <input type="password" id="password">
        <p id="passwordError" class="error"></p>
        <button type="submit">login</button>
    </form>
    <p>Don't have an account? <a href="register.html">Regidter now</a></p>
    <p id="successMessage" class="success"></p>

    <script>
        let form = document.getElementById("loginForm");
        form.addEventListener("click",(e)=>{
            e.preventDefault()

            let email= document.getElementById("email").value.trim()
            let password= document.getElementById("password").value


            let emailError= document.getElementById("emailError")
            let passwordError= document.getElementById("passwordError")
            let succesMessage=document.getElementById("successMessage")

            emailError.textContent="";
            passwordError.textContent="";
            succesMessage.textContent="";


            let isValid= true;

            if(email ===""){
                emailError.textContent="Email is required"
                isValid=false
            }

              if(password ===""){
                passwordError.textContent="password is required"
                isValid=false
            }

            if(!isValid){
                return;
            }



            let storedUser= localStorage.getItem("user")

            let user=JSON.parse(storedUser);



            if(email === user.email && password === user.password){
                succesMessage.textContent="LOgin succesfull"
                localStorage.setItem("isLoggedIn","true")
                setTimeout(()=>{
                    window.location.href="index.html";
                },1000)
            }
            else{
                passwordError.textContent="invalisnemail or password"
            }
        })




    </script>

    
</body>
</html>
