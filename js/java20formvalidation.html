<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>


<div class="">
    <div class="">
    <form id="myForm" >
        <label>Name:</label>
        <input type="text" id="username">
        <br><br>
        <label>Email</label>
        <input type="text" id="email">
        <p id="ev"></p>
        <br><br>
        <label>number</label>
        <input type="number" id="phone">
        <br><br>
        <p id="vp"></p>
        <button type="submit">Register</button>
    </form>
    </div>
</div>
    <script>

        let form = document.getElementById("myForm");
        form.addEventListener("submit",(e) =>{
            e.preventDefault()
            let name=document.getElementById("username").value.trim();
            if (name==""){
                console.log("invalid name");
            }
            else{
                console.log("valid name");
            }

            let emailpattern =/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let email=document.getElementById("email").value
            console.log(emailpattern.test(email));
            if(!(emailpattern.test(email))){
           
                let ev =document.getElementById("ev");
                ev.textContent="invalid"
            }
            else{
                  document.getElementById("ev").textContent="valid"

            }
            

            
            let phonepattern =/^[6-9]\d{9}$/;
            let phone=document.getElementById("phone").value
            console.log(phonepattern.test(phone));
            if(!(phonepattern.test(phone))){
                document.getElementById("vp").textContent="invalid";
            }else{
                 document.getElementById("vp").textContent="valid";
                
            }
        });





    </script>
    
</body>
</html>
