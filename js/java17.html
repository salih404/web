<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="btn">get user</button>
    <h2 id="status">loading</h2>
    <div id="spinner">loading...</div>
    <p id="message"></p>
    <div id="loading">loading...</div>
    <p id="error"></p>

    <script>

        // loading states - data is being fetch ,process is running
        //usually display using spinner , loading text , progress bar

        // adding loading state

        fetch("https:jsonplaceholder.typicode.com/users")

        .then((Response)=>{
            return response.json();
        })
        .then((data)=>{
            document.getElementById('status').textContent="Data Loaded"
            console.log(data);

        });

        // spinner example

         fetch("https:jsonplaceholder.typicode.com/post")
         .then((response)=>{
            return response.json();
         })
         .then((data)=>{
            document.getElementById("spinner").style.display="none";
            console.log(data);
         });


         //showing error message in ui

         fetch("wrong-url")

         .then((response)=>{
            return response.json();
         })
         .catch((error)=>{
            document.getElementById("message").textContent="failed to load data"
         });

         //loading + error together

         fetch("https:jsonplaceholder.typicode.com/users")

         .then((response)=>{
            if(!response.ok){
                throw new Error("Request failed");
            }
            return response.jason();
         })
         .then((data)=>{
            document.getElementById("loading").style.display='none';
            console.log(data);
         })
         .catch((error)=>{
            document.getElementById("loading").style.display="none"
            document.getElementById("error").textContent="failed to load data"
         });
         
    </script>
    
</body>
</html>
