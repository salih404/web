<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // session storage

// session storage - is a built-in JavaScript Web Storage API
// used to store data temporarilty for a browser tab or window.
// The data is available until the tab is closed 

// setItem() -  to store data
sessionStorage.setItem("username","John");

//getItem() - retrieve data
let username = sessionStorage.getItem("username");
console.log(username);

// updating using setItem() - to store data
sessionStorage.setItem("username","Alice");
sessionStorage.setItem("password","Alice123");

// removeItem() - remove a specific item
sessionStorage.removeItem("password");

// clear all session storage
sessionStorage.clear();



// Storing Objects
// Since sessionStorage only stores strings, convert objects to JSON.

const user = {
    name: "John",
    age: 25
};

sessionStorage.setItem("user",JSON.stringify(user));

// Retrive objects

const userobj = JSON.parse(sessionStorage.getItem("user"));
console.log(userobj);

// check if a key exists

if(sessionStorage.getItem("user")) {
    console.log("Username exists");
} else {
    console.log("Username not found");
}
    </script>
    
</body>
</html>
