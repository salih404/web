<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>

    //fuction

    function greet(){
        console.log("hello javascript");
    }
    greet();
    
    //with parameters

    function add(num1,num2){
        console.log("Addition",num1 + num2)
        
    }
    add(2,3);

    //with return value


    function square(a){
        return a * a;
    }
    console.log("square",square(5));
    //or
    let result=square(5);
    console.log(result);


    //function expression


    const greeting = function(){
        console.log("hello");
    }
    greeting();


    //default parameter

    function student(name='neha'){
        console.log("hello"+ name);
    }
    student();
    student("arun");


    //rest parameter

    function demo(...args){
        console.log(args);
    }
    demo(1,2,3,4,5,6,7,);


    // arrow function

    const greetings = () => {
        console.log("hello");
    } 
    greeting();


    //arrow with parameter

    const addition = (x,y)=> {
        console.log(x+y);
    }
    addition(2,3);

    //arrow with return

    const mul = (x,y) => {
        return x * y ;
    }
    console.log(mul(2,3));


    //implicit return

    const squares = num => num * num;
    console.log(squares(5));

    const cal = (num1,num2) => num1 * num2;
    console.log(cal(5,2));

    


   </script>
    
</body>
</html>
