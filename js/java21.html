<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      
    
</head>
<body>
    <h2>Registration Form</h2>
    <form id="registrationForm">
        <div>
        <div class=" "> <label>Name</label>
        <input type="text" id="name">
        <p id="nameError" class="error"></p>
        </div>
        <label>Email</label>
        <input type="text" id="email" class="">
        <p id="emailError" class="error"></p>
        <label >phone</label>
        <input type="text" id="phone">
        <p id="phoneError" class="error"></p>
        <label>password</label>
         <input type="text" id="password">
        <p id="passwordError" class="error"></p>
        <button type="submit">Register</button>
        </div>
    </form>

    <p id="succesMessage" class="success"></p>

    <script>
        let form=document.getElementById("registrationForm");
        form.addEventListener("submit",(e)=>{
            e.preventDefault();

            let name=document.getElementById("name").value.trim();
            let email=document.getElementById("email").value.trim();
            let phone=document.getElementById("phone").value.trim();
            let password=document.getElementById("password").value


            let nameError=document.getElementById("nameError")
            let emailError=document.getElementById("emailError")
            let phoneError=document.getElementById("phoneError")
            let passwordError=document.getElementById("passwordError")
            let succesMessage=document.getElementById("succesMessage")


            //    clrar previous error
            nameError.textContent="";
            emailError.textContent="";
            phoneError.textContent="";
            passwordError.textContent="";
            succesMessage.textContent="";


         


            // regex patterns
            let namePattern = /^[A-Za-z ]{3,}$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            let phonePattern = /^[6-9]\d{9}$/;
            let passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$/;



            let isValid=true;


            //name  validation

            if (name ===""){
                nameError.textContent="Name is required"
                // isValid=false
            }
            else if (!namePattern.test(name)){
                nameError.textContent="Enter a valid name";
                // isValid=false
            }

            
            if (email === ""){
                emailError.textContent="Email is required"
                // isValid=false
            }
            else if (!emailPattern.test(email)){
                emailError.textContent="Enter a valid Email";
                // isValid=false
            }



             if (phone === ""){
                phoneError.textContent="phone is required"
                // isValid=false
            }
            else if (!phonePattern.test(phone)){
                phoneError.textContent="Enter a valid 10 digit phone number";
                // isValid=false
            }


              if (password === ""){
                passwordError.textContent="password is required"
                // isValid=false
            }
            else if (!passwordPattern.test(password)){
                passwordError.textContent="Enter a valid password";
                // isValid=false
                
            }
            


            if(isValid){
                succesMessage.textContent="Registration successfull";
                form.reset();
            }





           



        })
        


    </script>    
</body>
</html>
