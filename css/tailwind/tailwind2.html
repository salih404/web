<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailwind css 2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-4xl font-semibold text-indigo-700 text-center">Hello CSS</h1>
    <hr><br>
    <div>
        <div class="bg-blue-300 sm:bg-green-300 md:bg-yellow-300 lg:bg-fuchsia-300 ">1</div>
        <div class="bg-blue-300 sm:bg-green-300 md:bg-yellow-300 lg:bg-red-600">2</div>
        <div class="bg-blue-300 sm:bg-green-300 md:bg-yellow-300 lg:bg-violet-700 text-white">3</div>
        <div class="bg-blue-300 sm:bg-green-300 md:bg-yellow-300 lg:bg-blue-950 text-white">4</div>
    </div>
    <br><br>
    <button class="bg-blue-500 hover:bg-red-500 text-white p-3 active:bg-orange-400">Click</button><br><br>
    <label>Name:</label>
    <input class="border p-2 focus:border-blue-500 focus:outline-none"><br><br>
    <button class="bg-green-500 active:bg-red-500 p-3 text-white">Submit</button><br><br>

    <div class="group bg-gray-200 p-5">
        <h2 class="group-hover:text-red-500">Hello</h2>
        <p class="group-hover:translate-x-3">Move</p>
    </div>
    <div class="group w-60 p-5 bg-gray-100 rounded">
        <img class="group-hover:scale-110 duration-300 w-60 h-30" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7zDMYnGheNT1l7pEW3R5N3Uf4--yCjRprCG9W5WQ58g&s=10" alt="tiger">
        <p class="group-hover:text-blue-500"> Tailwind CSS</p>
    </div>
    <br><br>
    <div class="flex flex-col md:flex-row gap-4">
        <div class="flex justify-center items-center bg-red-600 p-5">1</div>
        <div class="flex justify-center items-center bg-blue-600 p-5">2</div>
        <div class="flex justify-center items-center bg-yellow-600 p-5">3</div>
    </div>

    <div class="grid grid-cols-3 gap-4 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
        <div class="bg-blue-400 p-5 sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300">1</div>
        <div class="bg-lime-300 p-5 sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300">2</div>
        <div class="bg-orange-950 p-5 text-white sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300">3</div>
        <div class="bg-cyan-400 p-5 sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300">4</div>
        <div class="bg-blue-700 p-5 sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300">5</div>
        <div class="bg-fuchsia-600 p-5 sm:bg-yellow-300 md:bg-fuchsia-300 lg:bg-gray-300 ">6</div>
    </div>

</body>
</html>
