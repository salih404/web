<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    :root{
        --primary: rgb(159, 244, 190);
        --secondary: blue;
        --font-size: 16px;
    }
    body{
        background-color: var(--primary);
        margin: 0;
     
    }
    .box{
        width: 220px;
        padding: 20px;
        margin: 20px;
        color: white;
        font-size: 20px;
        font-weight: bold;

    }
    .static-box{
        position: static;
        background-color: gray;
    }
    .relative-box{
        position: relative;
        top:20px;
        left: 40px;
        background-color: blue;
    }
    .container{
        position: relative;
        height: 250px;
        border: 3px solid black;
        margin: 20px;
    }
    .absolute-box{
        position: absolute;
        top:50px;
        left: 80px;
        background-color: red;
    }
    .fixed-box{
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: green;
        z-index: 1000;
    }
    .sticky-box{
        position: sticky;
        top: 0;
        background-color: orange;
        padding: 10px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }
    .content{
        height: 1200px;
        padding: 20px;
    }

   </style>
</head>
<body>
    <div class="sticky-box">
        Sticky Header
    </div>
   <div class="box static-box">
    Static position
   </div>
   <div class="box relative-box">
    relative position
   </div>
   <div class="container">
    <div class="box absolute-box">
        Absolute Position
    </div>
   </div>
   <div class="content">
    <h2>Sroll down</h2>
    <p>
        This page demonstrates all CSS position properties:
        static,relative,absolute,fixed,and sticky
    </p>
    <p>
        keep scrooling observe sticky and fixed behaviors.
    </p>
   </div>
    <div class="box fixed-box">
        Fixed Button
    </div>
</body>
</html>
